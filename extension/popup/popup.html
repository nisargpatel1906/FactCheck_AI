<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FactCheck AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>FactCheck AI</h1>
      <span class="status-pill status-disconnected" id="connection-status">Disconnected</span>
    </header>
    
    <div class="tabs">
      <button class="tab-btn active" id="tab-feed">Feed</button>
      <button class="tab-btn" id="tab-sources">Sources</button>
      <button class="tab-btn" id="tab-settings">Settings</button>
    </div>

    <main class="tab-content">
      <div id="feed-panel" class="panel">
        <p class="placeholder-text">Waiting for claims to check...</p>
      </div>
      <div id="sources-panel" class="panel hidden">
        <p class="placeholder-text">Sources will appear here.</p>
      </div>
      <div id="settings-panel" class="panel hidden">
        <div class="setting-item">
          <label for="enable-audio">Listen to tab's audio</label>
          <input type="checkbox" id="enable-audio">
        </div>
        <div class="setting-item">
          <label for="enable-overlay">Show FactCheck Overlay</label>
          <input type="checkbox" id="enable-overlay" checked>
        </div>
      </div>
    </main>
  </div>
  <script src="popup.js"></script>
</body>
</html>
